apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-api
  namespace: mlops-demo
  labels: {app: iris-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: iris-api}
  template:
    metadata:
      labels: {app: iris-api}
      annotations:
        mlops/run-id: replace-with-approved-run-id
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: iris-api:local-v1
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          envFrom: [{configMapRef: {name: iris-config}}]
          readinessProbe:
            httpGet: {path: /health/ready, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
