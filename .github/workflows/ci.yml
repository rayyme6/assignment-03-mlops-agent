name: assignment-checks
on:
  pull_request:
  push:
    branches: [master, main]
permissions:
  contents: read
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MLFLOW_TRACKING_URI: sqlite:////tmp/ci-mlflow.db
      MLFLOW_HTTP_REQUEST_TIMEOUT: "5"
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "0"
      MLFLOW_DISABLE_AGENT_HINT: "1"
      DVC_SITE_CACHE_DIR: /tmp/dvc-site-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]'
      - run: python scripts/create_dataset.py
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
  airflow-dag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AIRFLOW_HOME: /tmp/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'apache-airflow==3.1.3' --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.1.3/constraints-3.11.txt
      - run: python -c "from airflow.models.dagbag import DagBag; b=DagBag('dags', include_examples=False); assert not b.import_errors, b.import_errors; d=b.dags.get('training_pipeline'); assert d is not None; assert len(d.tasks)==5"
